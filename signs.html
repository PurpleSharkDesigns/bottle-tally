<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<title>Event Signs — Purple Shark</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@400;500;600&display=swap">
<style>
:root{
  --deep:#0C1F14; --deep2:#132B1C; --cream:#F4EBDB; --dim:#B9AE98;
  --gold:#C9A94E; --velvet:#7B1E2B;
  --beam:#C9892F; --knob:#1F6B46; --hayden:#B4702A;
  --display:"Cormorant Garamond",Georgia,serif;
  --label:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--deep)}
body{font-family:var(--label);color:var(--cream);user-select:none;-webkit-user-select:none}

#stage{position:fixed;inset:0;display:flex;align-items:stretch}
.photo{flex:0 0 50%;position:relative;overflow:hidden;background:#09150E}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.photo::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 80%,var(--deep) 100%)}

.panel{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;
  padding:clamp(24px,3.4vw,46px) clamp(26px,3.6vw,52px);
  padding-right:calc(clamp(26px,3.6vw,52px) + env(safe-area-inset-right,0px));
  background:radial-gradient(120% 90% at 85% 15%, var(--deep2) 0%, var(--deep) 70%)}

.pcontent{width:100%;max-width:520px;margin-inline:auto;flex:1;display:flex;flex-direction:column}
.pbody{margin-block:auto}
.eyebrow{font-family:var(--label);font-size:clamp(13px,1.5vw,19px);font-weight:600;
  letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin:0 0 .55em}
h1{font-family:var(--display);font-weight:600;line-height:1.02;margin:0;
  font-size:clamp(32px,4.4vw,56px);letter-spacing:-.012em;text-wrap:balance}
h1 em{font-style:italic;color:var(--gold);display:inline-block;margin-top:.12em}
.sub{font-family:var(--display);font-style:italic;font-size:clamp(16px,1.75vw,23px);
  color:var(--cream);opacity:.9;margin:.5em 0 0;line-height:1.25;
  text-wrap:balance}

.rule{height:1px;background:linear-gradient(90deg,var(--gold),rgba(201,169,78,.12));
  margin:clamp(16px,2.6vh,28px) 0}

.pourlbl{font-size:clamp(11px,1.15vw,15px);font-weight:600;letter-spacing:.34em;
  text-transform:uppercase;color:var(--dim);margin:0 0 .5em}
.pours{display:flex;flex-direction:column;gap:.34em;margin:0}
.pour{font-family:var(--display);font-size:clamp(20px,2.5vw,33px);line-height:1.12;
  display:flex;align-items:baseline;gap:.5em}
.pour b{font-weight:600}
.dot{flex:none;width:.42em;height:.42em;border-radius:50%;background:var(--accent,var(--gold));
  transform:translateY(-.18em)}

.offer{margin:clamp(16px,2.6vh,28px) 0 0;padding:clamp(12px,1.5vh,17px) clamp(14px,1.7vw,20px);
  border:1px solid rgba(201,169,78,.42);border-radius:4px;background:rgba(201,169,78,.07);
  font-family:var(--display);font-size:clamp(16px,1.72vw,22px);line-height:1.35;color:var(--cream);
  text-wrap:balance}
.offer.ph{border-style:dashed;color:var(--gold);font-style:italic;opacity:.92}

footer{display:flex;align-items:center;gap:clamp(11px,1.3vw,16px);flex:none;
  margin-top:clamp(18px,2.6vh,30px);padding-top:clamp(12px,1.8vh,18px);
  border-top:1px solid rgba(201,169,78,.22)}
footer .qr{flex:none;width:clamp(58px,5.4vw,72px);height:clamp(58px,5.4vw,72px);
  background:var(--cream);border-radius:5px;padding:3px;display:block}
footer .qr img{display:block;width:100%;height:100%;border-radius:3px;image-rendering:pixelated}
footer .ftxt{display:flex;flex-direction:column;gap:1px;
  font-size:clamp(9px,.92vw,12px);letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
footer b{color:var(--cream);font-weight:600;letter-spacing:.28em}
footer i{font-style:normal}
footer em{font-style:normal;color:var(--gold);letter-spacing:.14em;text-transform:none;
  font-size:clamp(10px,1.05vw,14px);font-family:var(--display);margin-top:2px}

/* switcher */
#tabs{position:fixed;top:0;left:0;right:0;display:flex;gap:1px;z-index:5;
  padding-top:env(safe-area-inset-top,0px);opacity:0;transition:opacity .25s;pointer-events:none}
#tabs.show{opacity:1;pointer-events:auto}
#tabs button{flex:1;background:rgba(9,21,14,.9);border:0;border-bottom:2px solid transparent;
  color:var(--dim);font-family:var(--label);font-size:13px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;padding:13px 8px;cursor:pointer}
#tabs button[aria-current="true"]{color:var(--cream);border-bottom-color:var(--gold)}
#hold{position:fixed;right:0;bottom:0;width:150px;height:150px;z-index:9;
  touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  display:flex;align-items:center;justify-content:center}
#dot{width:7px;height:7px;border-radius:50%;background:rgba(201,169,78,.3);
  transition:width .2s,height .2s,background .2s;pointer-events:none}
#hold.arming #dot{width:54px;height:54px;background:rgba(201,169,78,.5);
  transition:width 2.4s linear,height 2.4s linear,background 2.4s linear}
#hold.off{pointer-events:none}
#hold.off #dot{opacity:0}
#tabs button.lk{flex:0 0 auto;padding-inline:18px;color:var(--gold)}
#hint{position:fixed;right:14px;bottom:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(185,174,152,.45);z-index:5;
  opacity:0;transition:opacity .25s;pointer-events:none}
#hint.show{opacity:1}

@media (max-aspect-ratio:1/1){
  #stage{flex-direction:column}
  .photo{flex:0 0 38%}
  /* portrait crops vertically, so frame the neck tag rather than the middle of the glass */
  .photo img{object-position:50% 17%}
  .photo::after{background:linear-gradient(180deg,transparent 50%,var(--deep) 100%)}
  .panel{padding:clamp(22px,4vw,40px) clamp(24px,5vw,48px) clamp(28px,4vh,44px)}
  .pcontent{max-width:620px}
  h1{font-size:clamp(32px,6.2vw,56px)}
  .sub{font-size:clamp(16px,2.3vw,23px)}
  .pour{font-size:clamp(20px,3.6vw,33px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

const $ = s => document.querySelector(s);
let i = 0;

function todayISO(){
  const n = new Date();
  return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
}
function render(){
  const s = D.signs[i];
  const offerHTML = '<div class="offer">'+COPY.offer+'</div>';
  $("#stage").innerHTML = `
    <div class="photo"><img src="data:image/jpeg;base64,${D.img[s.key]}" alt=""></div>
    <div class="panel" style="--accent:var(--${s.accent})">
     <div class="pcontent">
      <div class="pbody">
      <p class="eyebrow">${COPY.eyebrow}</p>
      <h1>${COPY.h1}<br><em>${COPY.h2}</em></h1>
      <p class="sub">${COPY.sub}</p>
      <div class="rule"></div>
      <p class="pourlbl">Featured today</p>
      <div class="pours">
        <div class="pour"><span class="dot"></span><b>${s.b1}</b></div>
        <div class="pour"><span class="dot"></span><b>${s.b2}</b></div>
      </div>
      ${offerHTML}
      </div>
      <footer>
        <span class="qr"><img src="data:image/png;base64,${QR}" alt="purplesharkdesigns.com"></span>
        <span class="ftxt"><b>Purple Shark Designs</b>
          <i>Marysville, Ohio</i><em>${COPY.site}</em></span>
      </footer>
     </div>
    </div>`;
  [...document.querySelectorAll("#tabs button")].forEach((b,n) =>
    b.setAttribute("aria-current", n === i ? "true" : "false"));
}
const LK = "psd-sign-lock";
let locked = false;
try { locked = localStorage.getItem(LK) === "1"; } catch(e) {}
function setLocked(v){
  locked = v;
  try { localStorage.setItem(LK, v ? "1" : "0"); } catch(e) {}
  $("#hold").classList.toggle("off", !locked);
  if(locked) { clearTimeout(t); $("#tabs").classList.remove("show"); $("#hint").classList.remove("show"); }
  else flash();
}
$("#tabs").innerHTML = D.signs.map((s,n) =>
  `<button type="button" data-i="${n}">${s.label}</button>`).join("")
  + '<button type="button" class="lk" data-lock="1">Lock</button>';
$("#tabs").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.lock) { setLocked(true); return; }
  i = +b.dataset.i; render(); flash();
};
// tapping the sign cycles -- unless it is locked, then nothing happens at all
$("#stage").onclick = () => {
  if(locked) return;
  i = (i+1) % D.signs.length; render(); flash();
};

// press and hold the bottom-right corner for about two seconds to unlock
(function(){
  const hold = $("#hold");
  let ht = null;
  const start = ev => {
    if(!locked) return;
    ev.preventDefault();
    /* keep the press even if the finger rolls off the corner, and stop iPad Safari
       from cancelling it as a scroll or text-selection gesture */
    try { hold.setPointerCapture(ev.pointerId); } catch(e) {}
    hold.classList.add("arming");
    clearTimeout(ht);
    ht = setTimeout(() => { hold.classList.remove("arming"); setLocked(false); }, 2400);
  };
  const stop = () => { clearTimeout(ht); hold.classList.remove("arming"); };
  hold.addEventListener("pointerdown", start);
  hold.addEventListener("pointerup", stop);
  hold.addEventListener("pointercancel", stop);
  hold.addEventListener("touchstart", e => { if(locked) e.preventDefault(); }, {passive:false});
  hold.addEventListener("contextmenu", e => e.preventDefault());
})();

let t = null;
function flash(){
  $("#tabs").classList.add("show"); $("#hint").classList.add("show");
  clearTimeout(t); t = setTimeout(() => {
    $("#tabs").classList.remove("show"); $("#hint").classList.remove("show");
  }, 3200);
}
// start on tonight's pairing when today is an event day
const k = D.sched[todayISO()];
if(k) i = Math.max(0, D.signs.findIndex(s => s.key === k));
render();
$("#hold").classList.toggle("off", !locked);
if(!locked) flash();

(async()=>{ try{ if(navigator.wakeLock) {
  let w = await navigator.wakeLock.request("screen");
  document.addEventListener("visibilitychange", async () => {
    if(document.visibilityState === "visible"){ try{ w = await navigator.wakeLock.request("screen"); }catch(e){} }
  });
} }catch(e){} })();
